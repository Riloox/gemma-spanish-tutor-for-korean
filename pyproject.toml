[project]
name = "my-own-lightweight-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2026.4",
    "verbecc>=2.0.3",
]

# Step 3 (training) needs PyTorch with CUDA. Kept in its own group so the data scripts stay light:
#   uv sync --group train
[dependency-groups]
train = [
    "torch>=2.14",
    "transformers>=5.10.1",
    "peft>=0.19",
    "trl>=1.0",
    "bitsandbytes>=0.49",
    "accelerate",
    "datasets",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
